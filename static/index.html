<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Health &amp; Fitness Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23141821'/%3E%3Cpath d='M3 12h4.2l1.8-4.5 3 9 2.4-6.5 1.6 2H21' fill='none' stroke='%23ff6a3d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-pulse"/></svg></span>
      <div class="brand-name">Health &amp; Fitness Tracker</div>
    </div>
    <div class="lifetime" id="lifetime" aria-label="Lifetime stats"></div>
    <div class="appbar-right">
      <span class="powered" title="Workouts from Fitbod, synced through Apple Health">
        <span>Powered by</span>
        <img src="img/fitbod.png" alt="Fitbod" width="20" height="20">
        <span class="powered-plus">+</span>
        <img src="img/apple-health.png" alt="Apple Health" width="20" height="20">
      </span>
      <span id="sync-status" class="sync-pill"><i></i><span>Loading…</span></span>
      <label class="btn btn-ghost" title="Import a Health Auto Export JSON file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-upload"/></svg><span>Import</span>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </label>
    </div>
  </header>

  <main class="page">
    <section class="hero" aria-label="Highlights">
      <article class="card hero-card last-card" id="last-card" tabindex="0"></article>
      <article class="card hero-card streak-card" id="streak-card"></article>
      <article class="card hero-card week-card" id="week-card"></article>
    </section>

    <section class="col-center">
      <section id="empty" class="card empty" hidden>
        <h2>No workouts yet</h2>
        <p>Point a Health Auto Export <strong>REST API</strong> automation at
          <code id="empty-url"></code> with header <code>Authorization: Bearer &lt;token from data/ingest_token.txt&gt;</code>
          (Workouts · JSON · Export Version 2), or use <strong>Import</strong> above with a manual export.</p>
      </section>

      <section class="card heatmap-card" aria-labelledby="heatmap-title">
        <div class="card-head">
          <div class="heat-title">
            <h2 id="heatmap-title">Last 12 months</h2>
            <span class="card-sub" id="heatmap-sub"></span>
          </div>
          <div class="heat-legend" aria-hidden="true">
            <span>Less</span><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>More</span>
          </div>
        </div>
        <div class="heatmap-scroll" id="heatmap-scroll"><svg id="heatmap" role="img"></svg></div>
      </section>

      <section class="card calendar-card">
        <div class="card-head calendar-head">
          <div class="month-nav">
            <button id="prev" class="icon-btn" aria-label="Previous month"><svg viewBox="0 0 24 24"><use href="#i-left"/></svg></button>
            <h2 id="month-title">—</h2>
            <button id="next" class="icon-btn" aria-label="Next month"><svg viewBox="0 0 24 24"><use href="#i-right"/></svg></button>
          </div>
          <button id="today" class="btn btn-ghost">Today</button>
        </div>
        <div class="calendar" id="calendar" role="grid" aria-labelledby="month-title"></div>
      </section>
    </section>

    <aside class="side">
      <div class="card" id="month-stats"></div>
      <div class="card form-card" id="form-card"></div>
      <div class="activity-stack">
        <div class="card activity-card" id="activity-card"></div>
        <div class="market-pit" id="market"></div>
      </div>
    </aside>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="detail" aria-label="Workout details" hidden>
    <button id="detail-close" class="icon-btn drawer-close" aria-label="Close details"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    <div id="detail-body"></div>
  </aside>

  <svg id="ropes" class="rope-layer" aria-hidden="true"></svg>
  <svg id="lights" class="rope-layer" aria-hidden="true"></svg>
  <svg id="rappel" class="rope-layer" aria-hidden="true"></svg>
  <svg id="billboard" class="rope-layer" aria-hidden="true"></svg>
  <svg id="washer" class="rope-layer" aria-hidden="true"></svg>
  <svg id="train" class="rope-layer" aria-hidden="true"></svg>

  <div class="trail" id="trail" hidden>
    <div class="trail-backdrop" data-close></div>
    <section class="trail-panel" role="dialog" aria-modal="true" aria-labelledby="trail-title">
      <button class="icon-btn trail-close" data-close aria-label="Close trail map"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
      <div id="trail-body"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-flame" x1="0" y1="1" x2="0.6" y2="0">
        <stop offset="0" stop-color="#ff3d77"/><stop offset="0.55" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ffb23d"/>
      </linearGradient>
      <linearGradient id="g-steps" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/>
      </linearGradient>
      <linearGradient id="g-ring" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
      </linearGradient>
    </defs>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4m0 0l-4 4m4-4l4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><g fill="currentColor" transform="rotate(-35 12 12)">
      <rect x="1" y="8" width="3" height="8" rx="1"/><rect x="4" y="5.5" width="3.4" height="13" rx="1.2"/>
      <rect x="7.4" y="10.6" width="9.2" height="2.8" rx="1"/>
      <rect x="16.6" y="5.5" width="3.4" height="13" rx="1.2"/><rect x="20" y="8" width="3" height="8" rx="1"/></g></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4.2l1.8-4.5 3 9 2.4-6.5 1.6 2H21" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4m0 1h10l-2 4 2 4H6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zm0 2H5a3 3 0 0 0 3 4m8-4h3a3 3 0 0 1-3 4M12 13v4m-4 3h8m-6-3h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>
  <script src="app.js"></script>
</body>
</html>
